name: Build APK (fork)

# Manual build of an installable Android APK from this fork, with the
# local API server unlocked. Signs with the debug key via the project's
# own CI fallback (no release keystore in this fork), so the APK is for
# personal sideloading only, not for store distribution.

on:
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
  RNLLAMA_SKIP_POSTINSTALL: '1'

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Derive the rnllama variant allowlist
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Create minimal .env (no secrets in this fork)
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          PALSHUB_API_BASE_URL=
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=
          GOOGLE_WEB_CLIENT_ID=
          EOL

      # The runner image already carries the Android SDK; the setup-android
      # action fails on current images (it asks sdkmanager for the removed
      # legacy 'tools' package), so install the components directly.
      - name: Install SDK components
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # The exact package ids for the newest platform shift between
          # channels, so resolve them from the catalog instead of guessing.
          "$SDKMANAGER" --list --channel=3 > /tmp/sdklist.txt 2>/dev/null || true
          PLAT=$(grep -oE "platforms;android-37[^[:space:]]*" /tmp/sdklist.txt | sort -u | head -1)
          BT=$(grep -oE "build-tools;37\.0\.0[^[:space:]]*" /tmp/sdklist.txt | sort -u | head -1)
          NDK=$(grep -oE "ndk;27\.3\.13750724[^[:space:]]*" /tmp/sdklist.txt | sort -u | head -1)
          echo "Resolved: platform=$PLAT build-tools=$BT ndk=$NDK"
          test -n "$PLAT" && test -n "$BT" && test -n "$NDK"
          "$SDKMANAGER" --channel=3 "$PLAT" "$BT" "$NDK"

      # Upstream injects the real file from a secret. Our fork build has no
      # Firebase project behind it, so a well-formed placeholder with the
      # app's package name satisfies the plugin; Firebase features stay off.
      - name: Write placeholder google-services.json
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pocketpal-fork-local"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {"package_name": "com.pocketpalai"}
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyDummyKeyForLocalForkBuildOnly00000"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          EOL

      - name: Build release APK (arm64 only, debug-signed via CI fallback)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-local-api-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
